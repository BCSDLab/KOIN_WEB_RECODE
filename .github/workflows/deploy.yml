name: Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  DEPLOY_PORT: '22222'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run lint
        run: yarn lint

      - name: Check types
        run: yarn typecheck

  build-and-deploy:
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'stage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Set deploy config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ARCHIVE_NAME=dist-production.tar.gz" >> $GITHUB_ENV
            echo "SENTRY_PROJECT=koin-prod" >> $GITHUB_ENV
            echo "DEPLOY_SCRIPT=/usr/local/koin/production/deploy/deploy.sh" >> $GITHUB_ENV
          else
            echo "ARCHIVE_NAME=dist.tar.gz" >> $GITHUB_ENV
            echo "SENTRY_PROJECT=koin-stage" >> $GITHUB_ENV
            echo "DEPLOY_SCRIPT=/usr/local/koin/stage/deploy/deploy.sh" >> $GITHUB_ENV
          fi

      - name: Create .env
        env:
          NEXT_PUBLIC_API_PATH: ${{ secrets.NEXT_PUBLIC_API_PATH }}
          NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
        run: |
          echo "NEXT_PUBLIC_API_PATH=$NEXT_PUBLIC_API_PATH" >> .env
          echo "NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID=$NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID" >> .env
          echo "NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=$NEXT_PUBLIC_GOOGLE_ANALYTICS_ID" >> .env
          echo "NEXT_PUBLIC_GTM_ID=$NEXT_PUBLIC_GTM_ID" >> .env
          echo "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN" >> .env
          echo "NEXT_PUBLIC_SENTRY_ENVIRONMENT=$NEXT_PUBLIC_SENTRY_ENVIRONMENT" >> .env

      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SENTRY_ORG: bcsd
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

      # 스모크 테스트가 실패하면 아카이브를 만들지 않으므로 배포로 넘어가지 않는다.
      - name: Create deploy package
        run: scripts/deploy/create-package.sh "$ARCHIVE_NAME"

      - name: Report archive size
        run: |
          {
            echo "### 배포 아카이브"
            echo '```'
            ls -lh "$ARCHIVE_NAME" | awk '{print $9, $5}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            # ssh-keyscan 은 최초 연결의 호스트 키를 무조건 신뢰한다(TOFU).
            echo "::warning::DEPLOY_HOST_KEY 시크릿이 없어 ssh-keyscan 으로 대체한다. MITM 검증이 되지 않는다."
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o ConnectTimeout=30 -P "$DEPLOY_PORT" "$ARCHIVE_NAME" "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/koin/web/"
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -lc '$DEPLOY_SCRIPT'"

  notify:
    needs: [build-and-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewer list
        uses: actions/checkout@v7
        with:
          # reviewer.json 만 필요하다.
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Resolve actor name
        id: resolve_actor
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const developers = JSON.parse(
              fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/reviewer.json'), 'utf8'),
            );
            const matched = developers.reviewers.find((person) => person.githubName === context.actor);
            core.setOutput('actorName', matched?.name ?? context.actor);

      - name: Send Slack Notification
        env:
          STATUS: ${{ needs.build-and-deploy.result }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ steps.resolve_actor.outputs.actorName }}
          # 셸에 직접 보간하면 커밋 메시지의 `$(...)` 가 러너에서 실행된다.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            ENVIRONMENT="Production"
          else
            ENVIRONMENT="Stage"
          fi
          COMMIT_TITLE=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)

          BODY=$(jq -n \
            --arg status "$STATUS" \
            --arg environment "$ENVIRONMENT" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commitMessage "$COMMIT_TITLE" \
            --arg runUrl "$RUN_URL" \
            '{status: $status, environment: $environment, repository: $repository, branch: $branch, actor: $actor, commitMessage: $commitMessage, runUrl: $runUrl}')

          curl -X POST https://api-slack.internal.bcsdlab.com/api/deploy/frontend \
            -H 'Content-Type: application/json' \
            -d "$BODY"
