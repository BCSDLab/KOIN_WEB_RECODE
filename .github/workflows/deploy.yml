name: Deploy
on:
  workflow_dispatch:
concurrency:
  group: Deploy-develop
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stage
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Verify stage release deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p 22222 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh -o ConnectTimeout=30 -p 22222 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          base=/usr/local/koin/stage
          expected=129d6c1cc49efa36074784aa62a7db5e46cb15fb
          exec 9>"$base/.deploy.lock"
          flock -w 300 9
          test "$(systemctl show koin-stage.service -p WorkingDirectory --value)" = "$base/current"
          test -L "$base/current"
          current=$(readlink -f "$base/current")
          [[ "$current" == "$base/releases/$expected-"* ]]
          curl -fsS --connect-timeout 2 --max-time 10 'http://127.0.0.1:3000/api/health?environment=stage' | jq -e --arg sha "$expected" '.status == "ok" and .environment == "stage" and .release == $sha'
          # 이번 작업에서 만든 사용하지 않는 사전 복사본과 실패한 업로드만 정리한다.
          unused="$base/releases/bootstrap-836acf78045856ef09d6d9c9a88db692234f8475"
          if [ -d "$unused" ] && [ "$current" != "$unused" ]; then
            rm -rf -- "$unused"
            echo 'Removed unused pre-migration snapshot'
          fi
          rm -f -- /home/ubuntu/koin/web/dist-129d6c1cc49efa36074784aa62a7db5e46cb15fb-38060654974-1.tar.gz
          systemctl show koin-stage.service -p ActiveState -p WorkingDirectory -p MainPID -p MemoryCurrent -p MemorySwapCurrent
          systemctl show koin-production.service -p ActiveState -p WorkingDirectory -p MainPID
          sudo -n journalctl -u koin-stage.service --since '2026-10-10 23:55:00' --no-pager | grep -E 'Stopping |Stopped |Started |Ready in|Main process exited|Failed with result' || true
          readlink "$base/current"
          du -sh "$base/releases/"*
          df -h /
          echo 'Server verification completed'
          REMOTE
