name: Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  DEPLOY_PORT: '22222'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run lint
        run: yarn lint

      - name: Check types
        run: yarn typecheck

  build-and-deploy:
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'stage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Set deploy config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ARCHIVE_NAME=dist-production.tar.gz" >> $GITHUB_ENV
            echo "SENTRY_PROJECT=koin-prod" >> $GITHUB_ENV
            echo "SENTRY_ENVIRONMENT=production" >> $GITHUB_ENV
            echo "LOCAL_DEPLOY_SCRIPT=scripts/deploy/server/production-deploy.sh" >> $GITHUB_ENV
          else
            echo "ARCHIVE_NAME=dist.tar.gz" >> $GITHUB_ENV
            echo "SENTRY_PROJECT=koin-stage" >> $GITHUB_ENV
            echo "SENTRY_ENVIRONMENT=stage" >> $GITHUB_ENV
            echo "LOCAL_DEPLOY_SCRIPT=scripts/deploy/server/stage-deploy.sh" >> $GITHUB_ENV
          fi

      - name: Create .env
        env:
          NEXT_PUBLIC_API_PATH: ${{ secrets.NEXT_PUBLIC_API_PATH }}
          NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
        run: |
          echo "NEXT_PUBLIC_API_PATH=$NEXT_PUBLIC_API_PATH" >> .env
          echo "NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID=$NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID" >> .env
          echo "NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=$NEXT_PUBLIC_GOOGLE_ANALYTICS_ID" >> .env
          echo "NEXT_PUBLIC_GTM_ID=$NEXT_PUBLIC_GTM_ID" >> .env
          echo "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN" >> .env
          echo "NEXT_PUBLIC_SENTRY_ENVIRONMENT=$NEXT_PUBLIC_SENTRY_ENVIRONMENT" >> .env
          echo "NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}" >> .env

      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SENTRY_ORG: bcsd
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

      # 스모크 테스트가 실패하면 아카이브를 만들지 않으므로 배포로 넘어가지 않는다.
      - name: Create deploy package
        run: scripts/deploy/create-package.sh "$ARCHIVE_NAME"

      - name: Report archive size
        run: |
          {
            echo "### 배포 아카이브"
            echo '```'
            ls -lh "$ARCHIVE_NAME" | awk '{print $9, $5}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            # ssh-keyscan 은 최초 연결의 호스트 키를 무조건 신뢰한다(TOFU).
            echo "::warning::DEPLOY_HOST_KEY 시크릿이 없어 ssh-keyscan 으로 대체한다. MITM 검증이 되지 않는다."
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          REMOTE_DEPLOY_SCRIPT="/home/ubuntu/koin/web/deploy-${SENTRY_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -o ConnectTimeout=30 -P "$DEPLOY_PORT" "$ARCHIVE_NAME" "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/koin/web/"
          scp -o ConnectTimeout=30 -P "$DEPLOY_PORT" "$LOCAL_DEPLOY_SCRIPT" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DEPLOY_SCRIPT"
          ssh -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -lc 'status=0; bash $REMOTE_DEPLOY_SCRIPT || status=\$?; rm -f $REMOTE_DEPLOY_SCRIPT; exit \$status'"

      # create-package.sh의 production focus가 devDependency인 @sentry/cli를 제외하므로 복원한다.
      - name: Restore Sentry CLI
        run: yarn install --immutable

      # 원격 배포와 health check가 모두 성공한 시점만 Sentry Deploy로 기록한다.
      - name: Record Sentry deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: bcsd
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          yarn sentry-cli releases deploys "$SENTRY_RELEASE" new \
            --env "$SENTRY_ENVIRONMENT" \
            --name "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  notify:
    needs: [build-and-deploy]
    if: always()
    uses: BCSDLab/.github/.github/workflows/notify-deploy.yml@v1
    with:
      track: frontend
      slack-endpoint: frontend
      status: ${{ needs.build-and-deploy.result }}
      environment: ${{ github.ref_name == 'main' && 'Production' || 'Stage' }}
