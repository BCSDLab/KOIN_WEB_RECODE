name: 'Pick Reviewer'

on:
  pull_request:
    types: opened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write # 리뷰어 지정

jobs:
  pick-reviewer:
    uses: BCSDLab/.github/.github/workflows/pick-reviewer.yml@v1
    with:
      track: frontend
      slack-endpoint: frontend
    secrets: inherit
