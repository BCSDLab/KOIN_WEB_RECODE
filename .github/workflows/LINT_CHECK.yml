name: lint-action

# develop push 는 deploy.yml 의 verify job 이 배포 게이트로 검사하므로 여기서 제외한다.
# main push 는 deploy.yml 이 트리거하지 않으므로 여기서 검사해야 한다.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ESLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check lint
        run: yarn lint

  TypeCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check types
        run: yarn typecheck
