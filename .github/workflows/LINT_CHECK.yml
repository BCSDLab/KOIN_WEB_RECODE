name: lint-action

# develop push 는 deploy.yml 의 verify job 이 배포 게이트로 검사하므로 여기서 제외한다.
# main push 는 deploy.yml 이 트리거하지 않으므로 여기서 검사해야 한다.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ESLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check lint
        run: yarn lint

  Format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check format
        run: yarn format:check

  TypeCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check types
        run: yarn typecheck

  ComplexityReport:
    # complexity/max-lines-per-function 측정 전용 작업이다. 위반 규모를 지켜보며 순차적으로
    # eslint.config.mjs에 error로 전환할 예정이라 아직은 머지를 막지 않는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Report complexity thresholds (non-blocking)
        continue-on-error: true
        run: yarn lint:complexity-report
