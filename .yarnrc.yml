approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

npmMinimalAgeGate: 0

packageExtensions:
  "@sentry/nextjs@*":
    dependencies:
      "@opentelemetry/core": "*"
      "@opentelemetry/sdk-trace-base": "*"

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64
  libc:
    - glibc

yarnPath: .yarn/releases/yarn-4.17.0.cjs
